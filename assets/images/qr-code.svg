<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100" fill="#111827">
  <!-- QR Code background -->
  <rect width="100" height="100" fill="#ffffff"/>
  
  <!-- Top-Left Position Detection Pattern -->
  <rect x="10" y="10" width="28" height="28" rx="2" fill="#111827"/>
  <rect x="14" y="14" width="20" height="20" rx="1" fill="#ffffff"/>
  <rect x="18" y="18" width="12" height="12" rx="1" fill="#111827"/>

  <!-- Top-Right Position Detection Pattern -->
  <rect x="62" y="10" width="28" height="28" rx="2" fill="#111827"/>
  <rect x="66" y="14" width="20" height="20" rx="1" fill="#ffffff"/>
  <rect x="70" y="18" width="12" height="12" rx="1" fill="#111827"/>

  <!-- Bottom-Left Position Detection Pattern -->
  <rect x="10" y="62" width="28" height="28" rx="2" fill="#111827"/>
  <rect x="14" y="66" width="20" height="20" rx="1" fill="#ffffff"/>
  <rect x="18" y="70" width="12" height="12" rx="1" fill="#111827"/>

  <!-- Timing Patterns -->
  <rect x="42" y="14" width="4" height="4" fill="#111827"/>
  <rect x="42" y="22" width="4" height="4" fill="#111827"/>
  <rect x="42" y="30" width="4" height="4" fill="#111827"/>
