  <rect x="22" y="42" width="4" height="4" fill="#111827"/>
  <rect x="30" y="42" width="4" height="4" fill="#111827"/>

  <!-- Alignment Pattern -->
  <rect x="66" y="66" width="18" height="18" rx="1" fill="#111827"/>
  <rect x="70" y="70" width="10" height="10" rx="1" fill="#ffffff"/>
  <rect x="73" y="73" width="4" height="4" rx="0.5" fill="#111827"/>

